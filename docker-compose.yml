services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: wayne
      POSTGRES_PASSWORD: wayne
      POSTGRES_DB: wayne
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayne -d wayne"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
